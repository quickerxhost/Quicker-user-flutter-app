name: quickerx
description: "QuickerX - Premium Hyperlocal Marketplace"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.0.5

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Location
  geolocator: ^13.0.1
  permission_handler: ^11.3.1
  google_maps_flutter: ^2.9.0

  # Voice / Barcode search
  speech_to_text: ^7.0.0
  mobile_scanner: ^6.0.2

  # Media / UX
  cached_network_image: ^3.4.1
  lottie: ^3.1.3
  shimmer: ^3.0.0

  # Utils
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  google_fonts: ^6.2.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icon/

# App icon generation — run `dart run flutter_launcher_icons` after
# `flutter pub get` to regenerate every platform's launcher icon from
# these two source images (see assets/icon/README.md for details).
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "launcher_icon"
  min_sdk_android: 21
  adaptive_icon_background: "#FDFDFD"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FDFDFD"
    theme_color: "#4400A8"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

# Native (pre-Flutter-engine) launch screen — run
# `dart run flutter_native_splash:create` after `flutter pub get` to theme
# the OS-level splash so it visually matches the app's own SplashScreen
# widget (off-white background + the same emblem) instead of Android's
# generic auto-generated one. See assets/icon/README.md for the full
# native-splash setup notes.
# Native splash is intentionally OFF (see assets/icon/README.md) — the app
# jumps straight from Android's own default launch background into the
# in-app SplashScreen (lib/features/splash/presentation/splash_screen.dart),
# which has the branding + progress indicator. If a branded native splash
# was generated previously, run `dart run flutter_native_splash:remove`
# once to restore the platform defaults.
flutter_native_splash:
  color: "#F8F9FA"
  image: assets/images/logo.png
  android_12:
    image: assets/images/logo.png
    icon_background_color: "#F8F9FA"
    color: "#F8F9FA"
  android: false
  ios: false
  web: false
